{% extends "base.html" %}

{% block content %}
<div class="login-container">
    <div class="logo-header">
        <div class="logo-circle">
            {% if logo_exists %}
            <img src="{{ url_for('static', filename=logo_file) }}" alt="RePOS Logo" class="logo-image">
            {% else %}
            <div class="logo-text">RePOS</div>
            <div class="logo-tagline">Predictive POS Maintenance</div>
            {% endif %}
        </div>
    </div>
    
    <div class="form-container">
        <div class="tab-container">
            <a href="{{ url_for('login') }}" class="tab active">Login</a>
            <a href="{{ url_for('signup') }}" class="tab">Sign Up</a>
        </div>
        
        {% if error %}
        <div class="error-message">{{ error }}</div>
        {% endif %}
        
        <form method="POST" action="{{ url_for('login') }}" class="auth-form">
            <div class="form-group">
                <label for="email">Email Address</label>
                <div class="input-wrapper">
                    <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                        <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                        <polyline points="22,6 12,13 2,6"></polyline>
                    </svg>
                    <input type="email" id="email" name="email" placeholder="Enter your email" required>
                </div>
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <div class="input-wrapper">
                    <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                    </svg>
                    <input type="password" id="password" name="password" placeholder="Enter your password" required>
                    <svg class="eye-icon" onclick="togglePassword('password')" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                        <circle cx="12" cy="12" r="3"></circle>
                    </svg>
                </div>
            </div>
            
            <div class="form-options">
                <label class="checkbox-label">
                    <input type="checkbox" name="remember" id="remember">
                    <span>Remember me</span>
                </label>
                <a href="#" class="forgot-password">Forgot password?</a>
            </div>
            
            <button type="submit" class="btn-primary">Login</button>
        </form>
    </div>
    
    <div class="footer-text">RePOS Predictive Maintenance System</div>
</div>
{% endblock %}
